name: test

on:
  push:
    branches: [main, local-runtime-v0.1.0]
  pull_request:

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host: ['0.1.1-rc.2', '0.2.0-rc.2', 'alpha']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install an independent official host without launching it
        # Use the same package manager as the host's plugin manager. Required
        # peers are installed; the public gate and generation checks run below.
        run: |
          mkdir -p "$RUNNER_TEMP/host-contract"
          pnpm add --ignore-scripts --dir "$RUNNER_TEMP/host-contract" "@deepseek-ai/dsh@${{ matrix.host }}"
      - name: Check actual host compatibility and public contracts
        run: node tools/check-host-contract.mjs "$RUNNER_TEMP/host-contract/node_modules/@deepseek-ai/dsh/package.json"
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Edge TTS worker uses the native WebSocket (Node >= 22, see README).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Mock Runtime, browser-controller, UI and release tests (no GPU or cloud)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Optional HTTP facade against mock objects only
        run: npm run test:adapter
      - name: Inspect npm package allowlist
        run: npm pack --dry-run
