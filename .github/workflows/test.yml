name: test

on:
  push:
    branches: [main, local-runtime-v0.1.0]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Edge TTS worker uses the native WebSocket (Node >= 22, see README).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Mock Runtime, browser-controller, UI and release tests (no GPU or cloud)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Optional HTTP facade against mock objects only
        run: npm run test:adapter
      - name: Inspect npm package allowlist
        run: npm pack --dry-run
